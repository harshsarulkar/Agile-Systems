<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Comm-Link</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1; --primary-hover: #4f46e5; --accent: #0ea5e9; --secondary: #d946ef;
            --bg-color: #0f111a;
            --bg-gradient: radial-gradient(circle at top right, #1e1b4b 0%, #0f111a 50%, #09090b 100%);
            --surface: rgba(20, 24, 39, 0.6); --border: rgba(255, 255, 255, 0.08); --border-light: rgba(255, 255, 255, 0.15);
            --glass-blur: blur(20px); --text-main: #f8fafc; --text-muted: #94a3b8; --status-done: #10b981;
            --high-pri: #f43f5e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg-color); background-image: var(--bg-gradient); background-attachment: fixed; color: var(--text-main); font-family: 'Inter', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }

        header { background: rgba(15, 17, 26, 0.8); backdrop-filter: var(--glass-blur); border-bottom: 1px solid var(--border); padding: 16px 32px; display: flex; align-items: center; z-index: 10; }
        .back-btn { color: var(--text-muted); text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 8px; transition: color 0.2s; }
        .back-btn:hover { color: #ffffff; }

        .app-container { display: flex; flex-grow: 1; height: calc(100vh - 61px); }

        .chat-sidebar { width: 380px; background: rgba(0,0,0,0.5); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-profile { padding: 32px; background: linear-gradient(180deg, rgba(99, 102, 241, 0.15) 0%, transparent 100%); border-bottom: 1px solid var(--border); position: relative; }
        .sidebar-profile::after { content: ''; position: absolute; bottom: -1px; left: 0; width: 30%; height: 2px; background: var(--primary); box-shadow: 0 0 10px var(--primary); }
        .profile-label { font-size: 11px; color: var(--accent); text-transform: uppercase; font-weight: 700; letter-spacing: 2px; margin-bottom: 8px; }
        .profile-name { font-size: 32px; font-weight: 800; color: #fff; letter-spacing: -1px; text-shadow: 0 4px 20px rgba(0,0,0,0.5); line-height: 1.1; margin-bottom: 4px; }
        .profile-role { font-size: 14px; color: var(--status-done); font-weight: 600; display: flex; align-items: center; gap: 8px; }

        .chat-sidebar-header { padding: 24px 32px; display: flex; flex-direction: column; gap: 16px; }
        .chat-search { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff; border-radius: 12px; padding: 14px 20px; font-size: 14px; outline: none; transition: all 0.3s; }
        .chat-search:focus { border-color: var(--accent); background: rgba(255,255,255,0.1); }

        .chat-contacts { flex-grow: 1; overflow-y: auto; padding: 0 16px 16px 16px; display: flex; flex-direction: column; gap: 8px; }
        .contact-item { display: flex; align-items: center; gap: 16px; padding: 16px; border-radius: 16px; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid transparent; }
        .contact-item:hover { background: rgba(255,255,255,0.03); transform: translateX(6px); }
        .contact-item.active { background: rgba(99, 102, 241, 0.1); border-color: rgba(99, 102, 241, 0.3); box-shadow: inset 4px 0 0 var(--primary); }

        .contact-avatar { width: 50px; height: 50px; border-radius: 14px; background: var(--surface); display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; font-size: 20px; position: relative; border: 1px solid var(--border-light); }
        .contact-status { position: absolute; bottom: -4px; right: -4px; width: 16px; height: 16px; border-radius: 50%; border: 3px solid var(--bg-color); }
        .contact-info { flex-grow: 1; display: flex; flex-direction: column; gap: 4px; }
        .contact-name { font-size: 16px; font-weight: 600; color: #fff; }
        .contact-role { font-size: 12px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px;}

        .chat-main { flex-grow: 1; display: flex; flex-direction: column; background: radial-gradient(circle at center, rgba(15, 17, 26, 0.9) 0%, rgba(9, 9, 11, 0.95) 100%); position: relative; }
        .chat-main-header { padding: 32px; background: rgba(0,0,0,0.4); backdrop-filter: var(--glass-blur); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 24px; z-index: 1; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .chat-active-name { font-size: 28px; font-weight: 800; color: #fff; letter-spacing: -0.5px; }
        .chat-active-status { font-size: 14px; color: var(--accent); font-weight: 500; display: flex; align-items: center; gap: 8px; margin-top: 6px;}

        .nav-icon-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); color: var(--text-main); border-radius: 12px; height: 40px; padding: 0 16px; display: flex; align-items: center; gap: 8px; justify-content: center; cursor: pointer; transition: all 0.3s; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;}
        .nav-icon-btn:hover { background: rgba(244, 63, 94, 0.2); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(244, 63, 94, 0.4); }

        .chat-messages { flex-grow: 1; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; gap: 24px; z-index: 1; }
        .msg-wrapper { display: flex; flex-direction: column; max-width: 75%; }
        .msg-wrapper.self { align-self: flex-end; align-items: flex-end; }
        .msg-wrapper.other { align-self: flex-start; align-items: flex-start; }

        .msg-bubble { padding: 18px 24px; border-radius: 20px; font-size: 15px; line-height: 1.6; color: #fff; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .msg-wrapper.self .msg-bubble { background: linear-gradient(135deg, var(--primary), var(--secondary)); border-bottom-right-radius: 4px; }
        .msg-wrapper.other .msg-bubble { background: rgba(30, 34, 53, 0.8); border: 1px solid var(--border-light); border-bottom-left-radius: 4px; backdrop-filter: blur(10px); }
        .msg-time { font-size: 11px; color: var(--text-muted); margin-top: 8px; font-weight: 500; letter-spacing: 0.5px;}

        .task-embed { background: rgba(0,0,0,0.4); border: 1px solid var(--border-light); border-left: 4px solid var(--accent); padding: 16px; border-radius: 12px; margin-top: 12px; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; gap: 8px;}
        .task-embed:hover { background: rgba(0,0,0,0.6); border-color: var(--accent); transform: translateX(2px); }

        .chat-input-container { padding: 24px 40px 40px 40px; background: transparent; display: flex; flex-direction: column; gap: 12px; z-index: 1; position: relative; }
        .input-row { display: flex; gap: 16px; align-items: center; width: 100%; }
        .floating-input-wrapper { flex-grow: 1; background: rgba(15, 17, 26, 0.85); backdrop-filter: blur(20px); border: 1px solid var(--border-light); border-radius: 50px; padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); transition: all 0.3s; position: relative;}
        .floating-input-wrapper input { flex-grow: 1; background: transparent; border: none; font-size: 16px; color: white; outline: none; }

        .chat-send-btn { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; border: none; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); }

        .task-dropdown { display: none; position: absolute; bottom: 70px; left: 0; width: 350px; background: rgba(20, 24, 39, 0.95); backdrop-filter: blur(20px); border: 1px solid var(--border-light); border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); overflow: hidden; z-index: 100;}
        .active-reference-pill { display: none; align-self: flex-start; background: rgba(14, 165, 233, 0.15); border: 1px solid var(--accent); color: var(--accent); padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 600; align-items: center; gap: 8px; animation: slideUp 0.3s ease forwards;}

        @keyframes slideInLeft { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
    </style>
</head>
<body>

<header>
    <a href="#" class="back-btn" id="back-link">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Return to Command Center
    </a>
</header>

<div class="app-container">
    <div class="chat-sidebar">
        <div class="sidebar-profile">
            <div class="profile-label">Current Identity</div>
            <div id="big-my-name" class="profile-name">Loading...</div>
            <div id="big-my-role" class="profile-role"><div class="status-dot-small" style="width: 8px; height: 8px; background: var(--status-done); border-radius: 50%;"></div> Operative</div>
        </div>
        <div class="chat-sidebar-header"><input type="text" class="chat-search" placeholder="Search roster..."></div>
        <div id="chat-contact-list" class="chat-contacts"></div>
    </div>

    <div class="chat-main">
        <div class="chat-main-header">
            <div id="chat-active-avatar" class="contact-avatar" style="width: 70px; height: 70px; font-size: 32px; border-radius: 20px; background: linear-gradient(135deg, var(--primary), var(--secondary)); border: none; box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3);">#</div>
            <div style="flex-grow: 1;">
                <div id="chat-active-title" class="chat-active-name">Team Global</div>
                <div id="chat-active-status" class="chat-active-status"><div class="status-dot-small" style="width: 8px; height: 8px; background: var(--status-done); border-radius: 50%; box-shadow: 0 0 10px var(--status-done);"></div> Secure Broadcast Channel</div>
            </div>
            <!-- WIPE HISTORY BUTTON -->
            <button class="nav-icon-btn" onclick="clearLocalChat()" style="border-color: var(--high-pri); color: var(--high-pri);">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"></path></svg>
                Wipe History
            </button>
        </div>

        <div id="global-chat-history" class="chat-messages"></div>

        <div class="chat-input-container">
            <div id="active-task-pill" class="active-reference-pill">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                <span id="active-task-text">Operation Linked</span>
                <span class="remove-ref" onclick="removeTaskRef()">✖</span>
            </div>

            <div class="input-row">
                <div class="floating-input-wrapper">
                    <button class="link-task-btn" onclick="toggleTaskMenu()" title="Reference an Operation">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                    </button>
                    <div id="task-menu" class="task-dropdown">
                        <div class="task-dropdown-header">Select Active Operation</div>
                        <div id="task-menu-list" class="task-dropdown-list"></div>
                    </div>
                    <input type="text" id="global-chat-input" placeholder="Type your transmission..." onkeypress="if(event.key === 'Enter') sendGlobalMessage()">
                    <button class="chat-send-btn" onclick="sendGlobalMessage()">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // WIPE HISTORY FUNCTION
    function clearLocalChat() {
        if(confirm("Confirm: Wipe visual comm-link history? (Database will not be affected)")) {
            document.getElementById('global-chat-history').innerHTML = '<div style="margin: auto; color: var(--text-muted); font-size: 15px; text-transform: uppercase; letter-spacing: 1px;">Local cache wiped. Awaiting new transmissions.</div>';
        }
    }

    const currentUserName = sessionStorage.getItem('commanderName') || "Unknown";
    const currentRole = sessionStorage.getItem('commanderRole') || 'Operative';

    let activeChatChannel = 'Team Global';
    let teamRosterData = []; let lastTeamHash = ""; let isFirstChatLoad = true; let lastMsgHash = "";
    let selectedTaskRef = null;

    async function loadGlobalMessages() {
        try {
            const encodedChannel = encodeURIComponent(activeChatChannel);
            const res = await fetch(`http://127.0.0.1:5000/api/chat/${encodedChannel}`);
            const messages = await res.json();
            const newHash = messages.length > 0 ? messages[messages.length-1]._id : 'empty';
            if (lastMsgHash !== newHash) { lastMsgHash = newHash; renderMessagesFromDB(messages, true); }
        } catch (e) {}
    }

    async function sendGlobalMessage() {
        const input = document.getElementById('global-chat-input');
        const text = input.value.trim();
        if(!text && !selectedTaskRef) return;
        input.value = '';
        const payload = { user: currentUserName, text: text, taskRef: selectedTaskRef };
        removeTaskRef();
        try {
            const encodedChannel = encodeURIComponent(activeChatChannel);
            await fetch(`http://127.0.0.1:5000/api/chat/${encodedChannel}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
            });
            loadGlobalMessages();
        } catch (e) { alert("Database Error: Could not send."); }
    }

    function renderMessagesFromDB(messages, animateLast = false) {
        const history = document.getElementById('global-chat-history');
        history.innerHTML = '';
        if (messages.length === 0) {
            history.innerHTML = '<div style="margin: auto; color: var(--text-muted); font-size: 15px; opacity: 0; animation: fadeIn 0.5s ease forwards; text-transform: uppercase; letter-spacing: 1px;">Secure connection established.</div>';
            return;
        }
        messages.forEach((m, idx) => {
            const isSelf = m.user === currentUserName;
            const wrapperClass = isSelf ? 'self' : 'other';
            const timeStr = new Date(m.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            const animStyle = (animateLast && idx === messages.length - 1) ? 'animation: slideUp 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;' : '';
            let embedHtml = '';
            if (m.taskRef && m.taskRef.id) {
                embedHtml = `<div class="task-embed" onclick="window.location.href='/task-details.html?id=${m.taskRef.id}'"><div class="embed-title">${m.taskRef.title}</div><div class="embed-meta"><span>Status: ${m.taskRef.status}</span> <span>•</span> <span>${m.taskRef.points} Pts</span></div></div>`;
            }
            history.innerHTML += `<div class="msg-wrapper ${wrapperClass}" style="${animStyle}"><div class="chat-author" style="display: ${isSelf ? 'none' : 'block'}; font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 8px;">${m.user}</div><div class="msg-bubble">${m.text ? m.text : ''} ${embedHtml}</div><div class="msg-time">${timeStr}</div></div>`;
        });
        history.scrollTop = history.scrollHeight;
    }

    function toggleTaskMenu() {
        const menu = document.getElementById('task-menu');
        menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        if(menu.style.display === 'block') fetchActiveTasksForMenu();
    }

    async function fetchActiveTasksForMenu() {
        const list = document.getElementById('task-menu-list');
        list.innerHTML = '<div style="padding: 16px; color: var(--text-muted); font-size: 12px; text-align: center;">Scanning database...</div>';
        try {
            const res = await fetch('http://127.0.0.1:5000/api/tasks/all');
            let tasks = await res.json();
            tasks = tasks.filter(t => t.status !== 'Archived' && t.status !== 'Aborted');
            if(tasks.length === 0) { list.innerHTML = '<div style="padding: 16px; color: var(--text-muted); font-size: 12px; text-align: center;">No active operations found.</div>'; return; }
            list.innerHTML = '';
            tasks.forEach(t => {
                const item = document.createElement('div'); item.className = 'task-dropdown-item';
                item.onclick = () => selectTaskRef(t);
                item.innerHTML = `<div class="task-item-title">${t.title}</div><div class="task-item-meta">${t.status} • ${t.storyPoints||0} Pts</div>`;
                list.appendChild(item);
            });
        } catch(e) { list.innerHTML = '<div style="padding: 16px; color: var(--high-pri); font-size: 12px;">Failed to load.</div>'; }
    }

    function selectTaskRef(task) {
        selectedTaskRef = { id: task._id, title: task.title, status: task.status, points: task.storyPoints || 0 };
        document.getElementById('task-menu').style.display = 'none';
        const pill = document.getElementById('active-task-pill');
        document.getElementById('active-task-text').innerText = `Linked: ${task.title}`;
        pill.style.display = 'flex';
        document.getElementById('global-chat-input').focus();
    }

    function removeTaskRef() {
        selectedTaskRef = null;
        document.getElementById('active-task-pill').style.display = 'none';
    }

    document.addEventListener('click', (e) => {
        const menu = document.getElementById('task-menu'); const btn = document.querySelector('.link-task-btn');
        if (menu.style.display === 'block' && !menu.contains(e.target) && !btn.contains(e.target)) menu.style.display = 'none';
    });

    async function loadTeam() {
        try {
            const res = await fetch('http://127.0.0.1:5000/api/team/all');
            const team = await res.json();
            let newRosterData = []; const now = new Date().getTime();
            team.forEach((member) => {
                if (!member.email) return; const newName = member.email.split('@')[0];
                const lastSeen = new Date(member.lastSeen).getTime(); const isOnline = (now - lastSeen) < 60000;
                newRosterData.push({name: newName, role: member.role || 'Operative', online: isOnline});
            });
            const currentHash = JSON.stringify(newRosterData); if (currentHash === lastTeamHash) return;
            lastTeamHash = currentHash; teamRosterData = newRosterData; renderGlobalContacts();
        } catch(e) {}
    }

    function renderGlobalContacts() {
        const contactList = document.getElementById('chat-contact-list'); contactList.innerHTML = '';
        const animStyle = isFirstChatLoad ? 'animation: slideInLeft 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;' : '';
        contactList.innerHTML += `<div class="contact-item ${activeChatChannel === 'Team Global' ? 'active' : ''}" onclick="selectGlobalChat('Team Global')" style="${animStyle}"><div class="contact-avatar" style="background: linear-gradient(135deg, var(--primary), var(--secondary)); border:none;">#</div><div class="contact-info"><span class="contact-name">Team Global</span><span class="contact-role">Broadcast Channel</span></div></div>`;
        teamRosterData.forEach((member, i) => {
            if(member.name === currentUserName) return;
            const statusColor = member.online ? 'var(--status-done)' : '#475569';
            const animDelay = isFirstChatLoad ? `animation-delay: ${i * 0.05}s;` : '';
            contactList.innerHTML += `<div class="contact-item ${activeChatChannel === member.name ? 'active' : ''}" onclick="selectGlobalChat('${member.name}')" style="${animStyle} ${animDelay}"><div class="contact-avatar">${member.name.charAt(0).toUpperCase()}<div class="contact-status" style="background: ${statusColor};"></div></div><div class="contact-info"><span class="contact-name">${member.name}</span><span class="contact-role">${member.role}</span></div></div>`;
        });
        isFirstChatLoad = false;
    }

    function selectGlobalChat(channelName) {
        activeChatChannel = channelName; lastMsgHash = "";
        document.getElementById('chat-active-title').innerText = channelName;
        const avatar = document.getElementById('chat-active-avatar'); const statusBox = document.getElementById('chat-active-status');
        if(channelName === 'Team Global') {
            avatar.style.background = 'linear-gradient(135deg, var(--primary), var(--secondary))'; avatar.innerText = '#';
            statusBox.innerHTML = '<div class="status-dot-small" style="width: 8px; height: 8px; background: var(--status-done); border-radius: 50%; box-shadow: 0 0 10px var(--status-done);"></div> Secure Broadcast Channel'; statusBox.style.color = "var(--accent)";
        } else {
            avatar.style.background = 'var(--surface)'; avatar.innerText = channelName.charAt(0).toUpperCase();
            const target = teamRosterData.find(m => m.name === channelName); const isOnline = target ? target.online : false;
            const sColor = isOnline ? 'var(--status-done)' : '#475569';
            statusBox.innerHTML = `<div class="status-dot-small" style="width: 8px; height: 8px; background: ${sColor}; border-radius: 50%; box-shadow: 0 0 10px ${sColor};"></div> ${isOnline ? 'Operative Online' : 'Operative Offline'}`; statusBox.style.color = isOnline ? "var(--status-done)" : "var(--text-muted)";
        }
        renderGlobalContacts(); loadGlobalMessages();
    }

    window.onload = () => {
        document.getElementById('big-my-name').innerText = currentUserName;
        document.getElementById('big-my-role').innerHTML = `<div style="width: 8px; height: 8px; background: var(--status-done); border-radius: 50%; box-shadow: 0 0 10px var(--status-done);"></div> ${currentRole}`;
        const backLink = document.getElementById('back-link');
        if (currentRole === 'Client') backLink.href = '/client-dashboard.html'; else backLink.href = '/dashboard.html';
        loadTeam(); loadGlobalMessages();
        setInterval(loadGlobalMessages, 2000); setInterval(loadTeam, 5000);
    };
</script>
</body>
</html>
