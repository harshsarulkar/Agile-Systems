<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint Command - Secure Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1; --primary-hover: #4f46e5; --accent: #0ea5e9; --bg-color: #0f111a;
            --bg-gradient: radial-gradient(circle at top right, #1e1b4b 0%, #0f111a 50%, #09090b 100%);
            --surface: rgba(20, 24, 39, 0.6); --border: rgba(255, 255, 255, 0.08); --border-light: rgba(255, 255, 255, 0.15);
            --glass-blur: blur(16px); --text-main: #f8fafc; --text-muted: #94a3b8;
            --high-pri: #f43f5e; --high-pri-bg: rgba(244, 63, 94, 0.15);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg-color); background-image: var(--bg-gradient); background-attachment: fixed; color: var(--text-main); font-family: 'Inter', sans-serif; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .auth-card { background: var(--surface); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: 1px solid var(--border); border-radius: 16px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); position: relative; overflow: hidden; }
        .auth-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(to right, var(--primary), var(--accent)); }
        .brand-title { font-weight: 700; font-size: 24px; letter-spacing: 1px; background: linear-gradient(to right, #818cf8, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; margin-bottom: 8px; }
        .subtitle { text-align: center; color: var(--text-muted); font-size: 13px; margin-bottom: 32px; letter-spacing: 0.5px; }
        .form-group { margin-bottom: 16px; text-align: left; }
        label { display: block; font-size: 12px; font-weight: 500; color: var(--text-muted); letter-spacing: 0.5px; margin-bottom: 8px; text-transform: uppercase; }
        input, select { width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--border); color: #ffffff; padding: 12px 16px; border-radius: 8px; outline: none; font-size: 14px; font-family: inherit; transition: all 0.3s; }
        input:focus, select:focus { border-color: var(--accent); background: rgba(0,0,0,0.4); box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1); }
        .btn { width: 100%; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; border: none; transition: all 0.3s; margin-top: 8px; letter-spacing: 0.5px; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4); }
        .switch-link { display: block; text-align: center; margin-top: 20px; font-size: 13px; color: var(--accent); cursor: pointer; background: none; border: none; width: 100%; font-family: inherit; transition: color 0.2s; }
        .switch-link:hover { color: #ffffff; text-decoration: underline; }
        #register-view, #otp-view { display: none; }
        #error-msg { display: none; background: var(--high-pri-bg); border: 1px solid var(--high-pri); color: #fda4af; padding: 10px; border-radius: 8px; font-size: 12px; text-align: center; margin-bottom: 20px; font-weight: 500; }
    </style>
</head>
<body>
<div class="auth-card">
    <div class="brand-title">SPRINT COMMAND</div>
    <div class="subtitle">Secure Identity Authentication</div>
    <div id="error-msg"></div>

    <div id="login-view">
        <div class="form-group"><label>Email Designation</label><input type="email" id="log-email" placeholder="operative@system.local"></div>
        <div class="form-group"><label>Security Clearance (Password)</label><input type="password" id="log-password" placeholder="••••••••" onkeypress="if(event.key === 'Enter') attemptLogin()"></div>
        <button class="btn btn-primary" onclick="attemptLogin()">Establish Link</button>
        <button class="switch-link" onclick="switchView('register-view')">Request New Clearance (Register)</button>
    </div>

    <div id="register-view">
        <div class="form-group"><label>Operative Name</label><input type="text" id="reg-name" placeholder="John Doe"></div>
        <div class="form-group"><label>Email Designation</label><input type="email" id="reg-email" placeholder="operative@system.local"></div>
        <div class="form-group"><label>Security Clearance (Password)</label><input type="password" id="reg-password" placeholder="••••••••"></div>
        <div class="form-group">
            <label>Assigned Role</label>
            <select id="reg-role">
                <option value="Project Manager">Project Manager</option>
                <option value="Developer">Developer</option>
                <option value="Designer">Designer</option>
                <option value="QA Tester">QA Tester</option>
                <option value="Client">Client</option>
            </select>
        </div>
        <button class="btn btn-primary" onclick="requestOTP()">Request Authorization Code</button>
        <button class="switch-link" onclick="switchView('login-view')">Return to Login</button>
    </div>

    <div id="otp-view">
        <div class="subtitle" style="margin-top: -10px;">An authorization code has been dispatched to your email.</div>
        <div class="form-group"><label>6-Digit Authorization Code</label><input type="text" id="reg-otp" placeholder="123456" maxlength="6" style="text-align: center; font-size: 20px; letter-spacing: 4px;" onkeypress="if(event.key === 'Enter') verifyAndRegister()"></div>
        <button class="btn btn-primary" onclick="verifyAndRegister()">Verify & Initialize</button>
        <button class="switch-link" onclick="switchView('register-view')">Cancel Sequence</button>
    </div>
</div>

<script>
    const AUTH_API = 'http://127.0.0.1:5050';
    function showError(msg) { const errBox = document.getElementById('error-msg'); errBox.innerText = msg; errBox.style.display = 'block'; setTimeout(() => { errBox.style.display = 'none'; }, 5000); }
    function switchView(id) { document.getElementById('error-msg').style.display = 'none'; document.getElementById('login-view').style.display = 'none'; document.getElementById('register-view').style.display = 'none'; document.getElementById('otp-view').style.display = 'none'; document.getElementById(id).style.display = 'block'; }

    async function attemptLogin() {
        const email = document.getElementById('log-email').value;
        const password = document.getElementById('log-password').value;
        if(!email || !password) return showError("Credentials required.");

        try {
            const res = await fetch(`${AUTH_API}/login`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ email, password }) });

            if(res.ok) {
                const data = await res.json();
                sessionStorage.setItem('commanderIdentity', email);
                sessionStorage.setItem('commanderName', data.name);
                sessionStorage.setItem('commanderRole', data.role);

                // --- NEW RBAC ROUTING LOGIC ---
                if (data.role === 'Client') {
                    window.location.href = '/client-dashboard.html';
                } else {
                    window.location.href = '/dashboard.html';
                }
            } else {
                const errorData = await res.json();
                showError(errorData.message || "Invalid Credentials.");
            }
        } catch (e) {
            showError("Connection to Auth Server failed. Is port 5050 running?");
        }
    }

    async function requestOTP() {
        const email = document.getElementById('reg-email').value; if(!email) return showError("Email is required for OTP.");
        try {
            const res = await fetch(`${AUTH_API}/send-otp`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ email }) });
            if(res.ok) { switchView('otp-view'); } else { const errorData = await res.json(); showError(errorData.message || "Failed to send OTP."); }
        } catch (e) { showError("Connection to Auth Server failed."); }
    }

    async function verifyAndRegister() {
        const payload = { name: document.getElementById('reg-name').value, email: document.getElementById('reg-email').value, password: document.getElementById('reg-password').value, role: document.getElementById('reg-role').value, otp: document.getElementById('reg-otp').value };
        try {
            const res = await fetch(`${AUTH_API}/register`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
            if(res.ok) { alert("Clearance Granted. Please log in."); document.getElementById('log-email').value = payload.email; switchView('login-view'); }
            else { const errorData = await res.json(); showError(errorData.message || "Invalid OTP or Registration Failed."); }
        } catch (e) { showError("Connection to Auth Server failed."); }
    }
</script>
</body>
</html>
